name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-flight runs for the same ref when a new commit lands.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Tool pins: every CI tool is pinned to an exact version so an upstream release
# cannot silently change the gate. Bump deliberately and re-run the full suite.
# GitHub Actions are pinned to immutable commit SHAs (not floating tags) so a
# compromised tag cannot replace the action we run; the Dependabot github-actions
# updater (see .github/dependabot.yml) opens PRs to bump these SHAs after they
# age in. The inline ruff/mypy/build version pins below are NOT auto-updated by
# Dependabot (its pip ecosystem scans package manifests, not workflow YAML);
# review and bump them manually, or adopt a real update mechanism.
jobs:
  lint:
    name: Lint (ruff ${{ matrix.ruff }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruff: ["0.6.9"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.10"
          cache: pip
      - run: pip install "ruff==${{ matrix.ruff }}"
      - run: ruff check .

  typecheck:
    name: Typecheck (mypy ${{ matrix.mypy }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mypy: ["1.11.2"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.10"
          cache: pip
      # mypy needs numpy stubs (and jax stubs are not published; the repo's
      # [tool.mypy] uses ignore_missing_imports for jax). Pin numpy to the
      # qualified 2.2.x line so the stubs match the current runtime.
      - run: pip install "mypy==${{ matrix.mypy }}" "numpy==2.2.6"
      # Lenient mypy over the package only (tests/ and benchmark modules are
      # excluded via [tool.mypy] in pyproject.toml).
      - run: mypy nisqa_jax/

  audit:
    name: Dependency audit (current CPU stack)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.10"
          cache: pip
      - name: Install qualified current stack and pinned auditor
        run: |
          pip install -e . -r requirements-jax.txt "pip-audit==2.9.0"
          pip check
      - name: Audit resolved environment
        run: python -m pip_audit --local --progress-spinner off

  test:
    name: Test (py${{ matrix.python-version }} / ${{ matrix.stack.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Exercise the declared compatibility floor, an intermediate JAX
        # minor, and the exact current runtime stack. JAX and jaxlib always
        # move as a matched pair, with a coherent numeric/dataframe stack.
        python-version: ["3.10", "3.11", "3.12"]
        stack:
          - name: floor-jax-0.4
            jax: "0.4.30"
            numpy: "1.26.4"
            scipy: "1.11.4"
            pandas: "2.1.4"
          - name: intermediate-jax-0.5
            jax: "0.5.3"
            numpy: "2.2.6"
            scipy: "1.15.3"
            pandas: "2.3.3"
          - name: current-jax-0.6
            jax: "0.6.2"
            numpy: "2.2.6"
            scipy: "1.15.3"
            pandas: "2.3.3"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install coherent runtime stack
        run: |
          pip install \
            -e ".[test]" \
            "jax==${{ matrix.stack.jax }}" \
            "jaxlib==${{ matrix.stack.jax }}" \
            "numpy==${{ matrix.stack.numpy }}" \
            "scipy==${{ matrix.stack.scipy }}" \
            "pandas==${{ matrix.stack.pandas }}" \
            "librosa==0.10.2.post1" \
            "soundfile==0.12.1"
          pip check
      - name: Artifact checksum + manifest + metadata verification (strict)
        run: python scripts/verify_artifacts.py --strict
      - name: Golden-vector parity gate (self-contained, no torch)
        # The golden gate is the primary CI correctness gate. It must NEVER
        # skip — a skip means the golden fixtures or shipped artifacts are
        # missing, which is a release-blocking error. Fail if any test skips.
        env:
          JAX_PLATFORMS: cpu
        run: |
          set -o pipefail
          pytest -q tests/test_golden_parity.py 2>&1 | tee /tmp/golden.txt
          # The summary line must not contain "skipped" with a non-zero count.
          ! grep -qP '\d+ skipped' /tmp/golden.txt
      - name: Full CPU test suite
        # Live PyTorch parity tests (test_jax_port.py -m parity) are NOT run
        # here: they require the source .tar checkpoints + PyTorch reference
        # source repo, which are not available in CI. They skip cleanly
        # (torch is not installed in the [test] extra). The self-contained
        # golden parity gate above is the CI correctness proof.
        env:
          JAX_PLATFORMS: cpu
        run: pytest -q

  build:
    name: Build + clean-room install + package-content gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.10"
          cache: pip
      - run: pip install "build==1.2.2.post1" "pytest==8.3.3"
      - name: Build sdist + wheel
        run: python -m build
      - name: Package-content gate (wheel + sdist carry required files)
        run: pytest -q tests/test_build_contents.py
      - name: Clean-room install from wheel
        run: |
          python -m venv /tmp/cleanroom_whl
          /tmp/cleanroom_whl/bin/pip install --no-deps dist/*.whl
          /tmp/cleanroom_whl/bin/pip install -r requirements-jax.txt
          /tmp/cleanroom_whl/bin/pip check
      - name: Clean-room install from sdist
        run: |
          python -m venv /tmp/cleanroom_sdist
          /tmp/cleanroom_sdist/bin/pip install --no-deps dist/*.tar.gz
          /tmp/cleanroom_sdist/bin/pip install -r requirements-jax.txt
          /tmp/cleanroom_sdist/bin/pip check
      - name: Import + WEIGHTS_DIR smoke (wheel)
        run: |
          cd /tmp
          /tmp/cleanroom_whl/bin/python -c "import nisqa_jax; from nisqa_jax.weights import WEIGHTS_DIR; import os; assert os.path.isdir(WEIGHTS_DIR); assert (WEIGHTS_DIR / 'nisqa_mos_only.npz').exists(); print('import OK:', WEIGHTS_DIR)"
      - name: Import + WEIGHTS_DIR smoke (sdist)
        run: |
          cd /tmp
          /tmp/cleanroom_sdist/bin/python -c "import nisqa_jax; from nisqa_jax.weights import WEIGHTS_DIR; import os; assert os.path.isdir(WEIGHTS_DIR); assert (WEIGHTS_DIR / 'nisqa_mos_only.npz').exists(); print('import OK:', WEIGHTS_DIR)"
      - name: CPU predict smoke (wheel)
        env:
          JAX_PLATFORMS: cpu
        run: |
          cd /tmp
          /tmp/cleanroom_whl/bin/python - <<'PY'
          import numpy as np, soundfile as sf
          sr=48000; t=np.linspace(0,1.5,int(sr*1.5),endpoint=False)
          sf.write('/tmp/smoke_sine.wav', (0.3*np.sin(2*np.pi*220*t)).astype(np.float32), sr)
          from nisqa_jax.weights import WEIGHTS_DIR
          print('WEIGHTS:', WEIGHTS_DIR / 'nisqa_mos_only.npz')
          PY
          /tmp/cleanroom_whl/bin/nisqa-jax --mode predict_file \
            --pretrained_model "$(/tmp/cleanroom_whl/bin/python -c 'from nisqa_jax.weights import WEIGHTS_DIR; print(WEIGHTS_DIR / "nisqa_mos_only.npz")')" \
            --deg /tmp/smoke_sine.wav
      - name: Clean-room wheel smoke (all 3 checkpoints, finite forward)
        # Load every bundled checkpoint and run a finite minimal forward pass on
        # each (not just existence/MOS): confirms all three convert+load+run
        # inside the installed wheel with no source checkout. Uses tiny
        # synthetic segment inputs (no audio preprocessing) to keep runtime
        # reasonable.
        env:
          JAX_PLATFORMS: cpu
        run: |
          cd /tmp
          /tmp/cleanroom_whl/bin/python - <<'PY'
          import numpy as np
          from nisqa_jax.weights import WEIGHTS_DIR
          from nisqa_jax import load_model
          for name in ("nisqa", "nisqa_mos_only", "nisqa_tts"):
              model = load_model(WEIGHTS_DIR / f"{name}.npz", device="cpu", precision="float32")
              feat = model.config.feature
              # Minimal finite forward: batch=1, 4 segments, all valid.
              x = np.zeros((1, 4, 1, feat.n_mels, feat.seg_length), dtype=np.float32)
              nw = np.array([4], dtype=np.int32)
              out = model.predict_segments(x, nw)
              out = np.asarray(out)
              assert out.shape[0] == 1, f"{name}: bad batch shape {out.shape}"
              assert np.isfinite(out).all(), f"{name}: non-finite output {out}"
              print(f"{name}: OK shape={out.shape} finite=True")
          PY
      - name: Artifact verifier (installed wheel)
        # Verify the artifacts inside the installed wheel's weights directory,
        # not the source checkout, so the gate inspects exactly what a wheel
        # consumer gets. The weights dir is resolved from the installed package
        # via WEIGHTS_DIR and passed explicitly to --weights-dir.
        run: |
          WDIR="$(/tmp/cleanroom_whl/bin/python -c 'from nisqa_jax.weights import WEIGHTS_DIR; print(WEIGHTS_DIR)')"
          /tmp/cleanroom_whl/bin/python "$GITHUB_WORKSPACE/scripts/verify_artifacts.py" --strict --weights-dir "$WDIR"
