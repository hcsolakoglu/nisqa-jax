name: CI

on:
  push:
    branches: [main, r2-release]
  pull_request:
    branches: [main]

# Cancel in-flight runs for the same ref when a new commit lands.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - run: pip install ruff
      - run: ruff check .

  typecheck:
    name: Typecheck (mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - run: pip install mypy numpy
      # Lenient mypy over the package only (tests/, adversarial_review/, and
      # bench scripts are excluded via [tool.mypy] in pyproject.toml).
      - run: mypy nisqa_jax/

  test:
    name: Test (py${{ matrix.python-version }} / jax ${{ matrix.jax }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
        jax: ["0.4.30"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[test]" "jax==${{ matrix.jax }}" "jaxlib==${{ matrix.jax }}"
      - name: Artifact checksum + manifest verification
        run: python scripts/verify_artifacts.py
      - name: pytest
        env:
          JAX_PLATFORMS: cpu
        run: pytest -q

  build:
    name: Build + clean-room install smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - run: pip install build
      - name: Build sdist + wheel
        run: python -m build
      - name: Clean-room install
        run: |
          python -m venv /tmp/cleanroom
          /tmp/cleanroom/bin/pip install --no-deps dist/*.whl
          /tmp/cleanroom/bin/pip install "jax==0.4.30" "jaxlib==0.4.30" \
            "numpy>=1.26,<2" "scipy>=1.11" "librosa>=0.10.2" "pandas>=2.1" "soundfile>=0.12"
      - name: Import smoke test
        run: |
          cd /tmp
          /tmp/cleanroom/bin/python -c "import nisqa_jax, weights; print('import OK:', weights.WEIGHTS_DIR)"
      - name: CPU predict smoke test
        env:
          JAX_PLATFORMS: cpu
        run: |
          cd /tmp
          /tmp/cleanroom/bin/python - <<'PY'
          import numpy as np, soundfile as sf
          sr=16000; t=np.linspace(0,1.5,int(sr*1.5),endpoint=False)
          sf.write('/tmp/smoke_sine.wav', (0.3*np.sin(2*np.pi*220*t)).astype(np.float32), sr)
          from weights import WEIGHTS_DIR
          print('WEIGHTS:', WEIGHTS_DIR / 'nisqa_mos_only.npz')
          PY
          /tmp/cleanroom/bin/nisqa-jax --mode predict_file \
            --pretrained_model "$(/tmp/cleanroom/bin/python -c 'from weights import WEIGHTS_DIR; print(WEIGHTS_DIR / "nisqa_mos_only.npz")')" \
            --deg /tmp/smoke_sine.wav
