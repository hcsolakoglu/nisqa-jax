[build-system]
# SPDX license expressions and `project.license-files` require setuptools 77+.
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nisqa-jax"
version = "0.1.0"
description = "Standalone JAX inference port for the shipped NISQA checkpoints"
readme = "README.md"
# The distribution contains MIT-licensed source and separately licensed
# CC-BY-NC-SA-4.0 model-weight artifacts. `AND` describes the obligations that
# apply to the combined wheel; it does not relicense either component.
license = "MIT AND CC-BY-NC-SA-4.0"
license-files = ["LICENSE", "nisqa_jax/weights/LICENSE_model_weights"]
requires-python = ">=3.10"
authors = [
  { name = "Hasan Can Solakoglu", email = "cansolakoglu130@gmail.com" },
]
keywords = ["speech-quality", "NISQA", "JAX", "MOS", "inference"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Operating System :: OS Independent",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Multimedia :: Sound/Audio :: Analysis",
  "Development Status :: 4 - Beta",
]
dependencies = [
  # CI exercises the compatibility floor (0.4.30/NumPy 1.26) and the current
  # tested stack (0.6.2/NumPy 2.2). Keep upper bounds below the next unqualified
  # minor until its cache/JIT and audio-frontend behavior pass the full matrix.
  "jax>=0.4.30,<0.7",
  "numpy>=1.26,<2.3",
  "scipy>=1.11,<2",
  "librosa>=0.10.2,<0.11",
  "pandas>=2.1,<3",
  "soundfile>=0.12,<0.13",
]

[project.optional-dependencies]
convert = ["torch>=2.0"]
# Convenience extra for editable/source installs on CUDA 12. The tested direct
# dependency pins are in requirements-gpu.txt; transitive CUDA runtimes remain
# resolver-managed, so that file is not a full lock.
cuda12 = ["jax[cuda12]==0.6.2"]
# `parity` adds torch for the live PyTorch parity tests (test_jax_port.py -m
# parity). Those tests also require the source .tar checkpoints + the PyTorch
# reference source repo at `nisqa_pytorch/` (source checkpoints may be
# redirected with NISQA_SOURCE_WEIGHTS_DIR); installing torch alone is NOT
# sufficient — tests skip cleanly without the source artifacts. CI relies on
# the self-contained golden parity gate (tests/test_golden_parity.py) instead.
parity = ["torch>=2.0", "pytest>=8"]
# `test` is the CI test extra: pytest only, no torch. The self-contained test
# suite (golden parity, artifact integrity, validation, prewarm, build
# contents) runs without torch; live PyTorch parity tests skip cleanly.
test = ["pytest>=8"]

[project.urls]
Homepage = "https://github.com/hcsolakoglu/nisqa-jax"
Repository = "https://github.com/hcsolakoglu/nisqa-jax"
Issues = "https://github.com/hcsolakoglu/nisqa-jax/issues"
Documentation = "https://github.com/hcsolakoglu/nisqa-jax/tree/main/docs"
Changelog = "https://github.com/hcsolakoglu/nisqa-jax/blob/main/CHANGELOG.md"

[project.scripts]
nisqa-jax = "nisqa_jax.predict:main"

[tool.setuptools.packages.find]
include = ["nisqa_jax*"]

# Bundled pre-converted weights (~3 MB total) ship inside the nisqa_jax.weights
# subpackage so a fresh install has zero-config inference. The .json shape-
# manifest sidecars and the model-weights LICENSE pointer travel alongside the
# .npz files. Consumers must use nisqa_jax.weights.WEIGHTS_DIR; there is no
# top-level `weights` package.
[tool.setuptools.package-data]
"nisqa_jax.weights" = ["*.npz", "*.json", "LICENSE_model_weights", "CHECKSUMS.sha256"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
# F401 unused-import is handled per-file below for re-export shims.
# E731 lambda assignments appear in benchmark modules intentionally.
# UP035 (typing.Sequence -> collections.abc) is stylistic modernization only;
# skipped to avoid churn across the codebase's typing imports.
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E731", "UP035"]

[tool.ruff.lint.per-file-ignores]
# __init__ re-exports symbols it does not define.
"nisqa_jax/__init__.py" = ["F401"]
"nisqa_jax/bench*.py" = ["E402"]
# Test files use an intentional import order: stdlib -> sys.path manipulation ->
# package imports -> local test utils, with `# noqa: E402` on late imports.
# Re-sorting would misplace those noqa markers, so leave test import order as-is.
"tests/**/*.py" = ["I001"]

[tool.pytest.ini_options]
markers = [
  "parity: requires trusted source checkpoints, the upstream PyTorch source checkout, and torch",
]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = false
warn_redundant_casts = false
check_untyped_defs = false
# JAX's pytree/typing surface is noisy and not annotated upstream; lenient mode
# keeps the gate useful (catches real signature/return drift) without churning
# the codebase with `# type: ignore` noise.
exclude = [
  "tests/",
  "nisqa_jax/bench.*",
]
