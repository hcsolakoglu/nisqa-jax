# Dependabot configuration for pinned GitHub Actions and Python runtime deps.
#
# CI actions are pinned to immutable commit SHAs (see .github/workflows/ci.yml)
# so a compromised tag cannot replace the action we run. The github-actions
# updater below opens PRs to bump those SHAs after they age in; each bump PR
# must pass the full CI gate before merge.
#
# The pip updater below handles declared Python runtime/build inputs in
# pyproject.toml / requirements files. It does NOT update the inline tool
# version pins that live directly in the workflow YAML (ruff/mypy/build matrix
# versions and the `pip install "ruff==..."` lines in ci.yml) -- Dependabot's
# pip ecosystem only scans package manifest files, not arbitrary YAML strings.
# Those inline pins require manual review (or adopt a real update mechanism
# such as a scheduled Renovate bot or a pip-compile pipeline) to stay current.
version: 2
updates:
  # GitHub Actions: bump the SHA-pinned actions in ci.yml.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci: "
    labels: ["ci", "dependencies"]
    groups:
      actions:
        patterns: ["*"]

  # pip: bump declared Python deps in pyproject.toml / requirements files.
  # NOTE: this does NOT bump the inline ruff/mypy/build pins in ci.yml (those
  # are workflow-YAML strings, not package manifests) -- review those manually.
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps: "
    labels: ["ci", "dependencies"]
    groups:
      runtime-stack:
        patterns:
          - "jax"
          - "jaxlib"
          - "numpy"
          - "scipy"
          - "pandas"
          - "librosa"
          - "soundfile"
