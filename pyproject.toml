[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nisqa-jax"
version = "0.1.0"
description = "Standalone JAX inference port for the shipped NISQA checkpoints"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "jax>=0.4.30",
  "numpy>=1.26,<2",
  "scipy>=1.11",
  "librosa>=0.10.2",
  "pandas>=2.1",
  "soundfile>=0.12",
]

[project.optional-dependencies]
convert = ["torch>=2.0"]
parity = ["torch>=2.0", "pytest>=8"]
test = ["pytest>=8", "torch>=2.0"]

[tool.setuptools.packages.find]
include = ["nisqa_jax*"]
