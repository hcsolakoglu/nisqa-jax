[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nisqa-jax"
version = "0.1.0"
description = "Standalone JAX inference port for the shipped NISQA checkpoints"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  # Pin jax to the tested 0.4.x minor. JAX's compilation-cache config API churns
  # across minors (e.g. `initialize_cache`/`is_initialized` were removed after
  # 0.4.30); this repo uses the version-tolerant `jax_compilation_cache_dir`
  # knob, but staying within 0.4.x avoids surprise breakage of the persistent
  # cache and JIT behavior. Bump only after re-running the full parity suite.
  "jax>=0.4.30,<0.5",
  "numpy>=1.26,<2",
  "scipy>=1.11",
  "librosa>=0.10.2",
  "pandas>=2.1",
  "soundfile>=0.12",
]

[project.optional-dependencies]
convert = ["torch>=2.0"]
parity = ["torch>=2.0", "pytest>=8"]
test = ["pytest>=8", "torch>=2.0"]

[tool.setuptools.packages.find]
include = ["nisqa_jax*"]
