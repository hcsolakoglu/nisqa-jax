[build-system]
# SPDX license expressions and `project.license-files` require setuptools 77+.
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nisqa-jax"
version = "0.1.0"
description = "Standalone JAX inference port for the shipped NISQA checkpoints"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [
  { name = "Hasan Can Solakoglu", email = "cansolakoglu130@gmail.com" },
]
keywords = ["speech-quality", "NISQA", "JAX", "MOS", "inference"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Operating System :: OS Independent",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Multimedia :: Sound/Audio :: Analysis",
  "Development Status :: 4 - Beta",
]
dependencies = [
  # Pin jax to the tested 0.4.x minor. JAX's compilation-cache config API churns
  # across minors (e.g. `initialize_cache`/`is_initialized` were removed after
  # 0.4.30); this repo uses the version-tolerant `jax_compilation_cache_dir`
  # knob, but staying within 0.4.x avoids surprise breakage of the persistent
  # cache and JIT behavior. Bump only after re-running the full parity suite.
  "jax>=0.4.30,<0.5",
  "numpy>=1.26,<2",
  "scipy>=1.11",
  "librosa>=0.10.2",
  "pandas>=2.1",
  "soundfile>=0.12",
]

[project.optional-dependencies]
convert = ["torch>=2.0"]
# Convenience extra for editable/source installs on CUDA 12. The tested direct
# dependency pins are in requirements-gpu.txt; transitive CUDA runtimes remain
# resolver-managed, so that file is not a full lock.
cuda12 = ["jax[cuda12_pip]==0.4.30"]
# `parity` adds torch for the live PyTorch parity tests (test_jax_port.py -m
# parity). Those tests also require the source .tar checkpoints + the PyTorch
# reference source repo on disk (see NISQA_SOURCE_WEIGHTS_DIR / PYTORCH_ROOT in
# tests/test_jax_port.py); installing torch alone is NOT sufficient — they skip
# cleanly without the source artifacts. CI relies on the self-contained golden
# parity gate (tests/test_golden_parity.py) instead.
parity = ["torch>=2.0", "pytest>=8"]
# `test` is the CI test extra: pytest only, no torch. The self-contained test
# suite (golden parity, artifact integrity, validation, prewarm, build
# contents) runs without torch; live PyTorch parity tests skip cleanly.
test = ["pytest>=8"]

[project.urls]
Homepage = "https://github.com/hcsolakoglu/nisqa-jax"
Repository = "https://github.com/hcsolakoglu/nisqa-jax"
Issues = "https://github.com/hcsolakoglu/nisqa-jax/issues"

[project.scripts]
nisqa-jax = "nisqa_jax.predict:main"

[tool.setuptools.packages.find]
include = ["nisqa_jax*"]

# Bundled pre-converted weights (~3 MB total) ship inside the nisqa_jax.weights
# subpackage so a fresh install has zero-config inference. The .json shape-
# manifest sidecars and the model-weights LICENSE pointer travel alongside the
# .npz files. Consumers must use nisqa_jax.weights.WEIGHTS_DIR; there is no
# top-level `weights` package.
[tool.setuptools.package-data]
"nisqa_jax.weights" = ["*.npz", "*.json", "LICENSE_model_weights", "CHECKSUMS.sha256"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
# F401 unused-import is handled per-file below for re-export shims and probes.
# E731 lambda assignments appear in benchmark/probe scripts intentionally.
# UP035 (typing.Sequence -> collections.abc) is stylistic modernization only;
# skipped to avoid churn across the codebase's typing imports.
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E731", "UP035"]

[tool.ruff.lint.per-file-ignores]
# __init__ re-exports symbols it does not define.
"nisqa_jax/__init__.py" = ["F401"]
# Benchmark / adversarial probe scripts are standalone scratch tooling; keep
# their imports and style loose rather than mass-reformatting.
"adversarial_review/**/*.py" = ["F401", "E402", "E701", "E702", "E401", "B023", "B007", "E741", "I001", "E501"]
"nisqa_jax/bench*.py" = ["E402"]
# Test files use an intentional import order: stdlib -> sys.path manipulation ->
# package imports -> local test utils, with `# noqa: E402` on late imports.
# Re-sorting would misplace those noqa markers, so leave test import order as-is.
"tests/**/*.py" = ["I001"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = false
warn_redundant_casts = false
check_untyped_defs = false
# JAX's pytree/typing surface is noisy and not annotated upstream; lenient mode
# keeps the gate useful (catches real signature/return drift) without churning
# the codebase with `# type: ignore` noise.
exclude = [
  "tests/",
  "adversarial_review/",
  "nisqa_jax/bench.*",
]
